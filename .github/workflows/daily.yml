name: Atualiza dados

on:
  schedule:
    - cron: "17 23 * * 1-5"   # 20:17 BRT, depois do fechamento da B3 e da ANBIMA
    - cron: "43 10 * * 2-6"   # 07:43 BRT, repescagem caso algo tenha atrasado
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monta latest.json
        run: python scripts/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "dados $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Limpa cache da CDN
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/data/latest.json" || true
